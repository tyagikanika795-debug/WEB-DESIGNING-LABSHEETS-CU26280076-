<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range and Number Input</title>
</head>
<body>
    <h2>Volume Control</h2>

    <label for="range">Volume:</label>

    <input
        type="range"
        id="range"
        min="0"
        max="100"
        value="50"
        oninput="volume.value = this.value"
    >

    <output id="volume">50</output> %

    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="1" max="100" value="1">

    <span> items</span>
</body>
</html>
