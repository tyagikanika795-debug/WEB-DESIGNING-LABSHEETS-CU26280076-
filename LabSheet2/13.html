<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Controls</title>
    <link rel="stylesheet" href="13.css">
</head>
<body>
    <h2>Custom Checkboxes</h2>

    <label class="control">
        <input type="checkbox">
        <span class="check"></span>
        Reading
    </label>

    <label class="control">
        <input type="checkbox">
        <span class="check"></span>
        Sports
    </label>

    <h2>Custom Radio Buttons</h2>

    <label class="control">
        <input type="radio" name="gender">
        <span class="radio"></span>
        Male
    </label>

    <label class="control">
        <input type="radio" name="gender">
        <span class="radio"></span>
        Female
    </label>
</body>
</html>
